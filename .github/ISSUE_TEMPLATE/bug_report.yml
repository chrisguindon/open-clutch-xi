name: Bug report
description: Something doesn't work, crashes or looks broken
title: 'Bug: '
labels: [bug, 'status:needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Short reports are welcome — fill in what you can.
        You don't need to know what causes the problem: describing what you saw is the useful part.
        First time? Check the [existing issues](../issues?q=is%3Aissue) in case it's already reported.

        **Privacy:** do not include passwords, access tokens, private files, personal profiling results or other sensitive information.
        **Security problems** (anything that could be exploited) should be reported privately — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What's the bug?
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do just before it happened? Numbered steps help others see it too.
      placeholder: |
        1. Quick Match, 5v5
        2. Win the ball near the touchline
        3. Press pass
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: reproducible
    attributes:
      label: Does it happen every time?
      options: [Every time, Sometimes, Only once so far, Not sure]
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options: [Quick Match, XI Nations Cup, Penalty shootout, Practice, Tutorial, Menus / settings, Other]
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options: [Beginner, Easy, Medium, Hard, Not relevant]
  - type: dropdown
    id: input
    attributes:
      label: Input method
      options: [Keyboard, Keyboard & mouse, Controller, Touch]
  - type: input
    id: browser
    attributes:
      label: Browser, operating system and device
      description: For example "Firefox 140 on Windows 11, laptop" or "Safari on an iPhone". Hardware details are optional.
      placeholder: Firefox 140 on Windows 11
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recordings (optional)
      description: Drag files here. Please check they contain nothing private.
  - type: textarea
    id: errors
    attributes:
      label: Error messages (optional)
      description: If you can, press F12, open the Console tab and copy any red lines here.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic information (optional)
      description: For performance problems, the numbers shown in the F3 panel (FPS, frame time, quality level) help. Please don't paste full system profiles or exports unless a maintainer asks.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
