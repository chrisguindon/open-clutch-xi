<html lang="en">
  <head>
    <!-- The BRAND_* placeholders below are filled from src/brand.ts at build time (vite.config.ts). -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta name="author" content="%BRAND_MAINTAINER%" />
    <meta name="theme-color" content="#05091a" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%BRAND_WEBSITE%" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_NAME%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:url" content="%BRAND_WEBSITE%" />
    <meta property="og:image" content="%BRAND_WEBSITE%social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND_NAME%" />
    <meta name="twitter:description" content="%BRAND_DESCRIPTION%" />
    <meta name="twitter:image" content="%BRAND_WEBSITE%social-card.jpg" />
    <title>%BRAND_NAME%</title>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="ui"></div>
    </div>
    <noscript>%BRAND_NAME% is a free 3D football game for the browser. It needs JavaScript and WebGL2 to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
